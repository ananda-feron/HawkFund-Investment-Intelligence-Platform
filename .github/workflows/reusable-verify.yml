name: Reusable verification

on: workflow_call

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: hawkfund
          POSTGRES_USER: hawkfund
          POSTGRES_PASSWORD: hawkfund
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hawkfund -d hawkfund"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://hawkfund:hawkfund@localhost:5432/hawkfund
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: npm ci
      - run: npm run lint:web && npm run typecheck:web && npm run test:web && npm run build:web
      - run: pip install -r apps/api/requirements-dev.txt
      - working-directory: apps/api
        run: ruff check app tests ../../db && ruff format --check app tests ../../db && mypy app && pytest
      - working-directory: apps/api
        run: alembic -c alembic.ini upgrade head
      - name: Liveness performance smoke test
        run: |
          cd apps/api
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:8000/health/live && break
            sleep 1
          done
          cd ../..
          python tests/performance/health_smoke.py
