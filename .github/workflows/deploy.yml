name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false
      - name: Build and push immutable images
        env:
          API_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/hawkfund-${{ inputs.environment }}-api:sha-${{ github.sha }}-${{ github.run_attempt }}
          WEB_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/hawkfund-${{ inputs.environment }}-web:sha-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          docker build --target production -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker build --target production -f apps/web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          echo "TF_VAR_api_image=$API_IMAGE" >> "$GITHUB_ENV"
          echo "TF_VAR_web_image=$WEB_IMAGE" >> "$GITHUB_ENV"
      - name: Apply infrastructure and register task definitions
        working-directory: infra/aws
        env:
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
          TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}
          TF_VAR_allowed_hosts: ${{ vars.ALLOWED_HOSTS }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=hawkfund/${{ inputs.environment }}.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve
      - name: Migrate before service rollout
        working-directory: infra/aws
        run: ../../scripts/deploy-ecs.sh "${{ inputs.environment }}"
